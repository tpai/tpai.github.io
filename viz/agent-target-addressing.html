<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>target — agent-target-addressing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=IBM+Plex+Sans+KR:wght@300;400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#151021; --edge:#322747;
  --parch:#E9E0CC; --parch-ink:#2B2338; --parch-dim:#7D7189;
  --torch:#F0A54A; --rune:#9C7BE8; --ok:#79C08B; --bad:#E0625C;
  --ink:#F0EAF8; --dim:#9C90B8;
  --disp:'Unbounded','IBM Plex Sans KR','PingFang TC','Noto Sans TC',sans-serif;
  --body:'IBM Plex Sans KR','PingFang TC','Noto Sans TC',-apple-system,sans-serif;
  --mono:'IBM Plex Mono','SFMono-Regular',Menlo,monospace;
  --hdr:57px;
}
*{box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--void);color:var(--ink);font:300 16px/1.75 var(--body);
  -webkit-font-smoothing:antialiased;padding-top:var(--hdr)}
a{color:inherit}
:focus-visible{outline:2px solid var(--torch);outline-offset:3px;border-radius:2px}

/* ---------- masthead ---------- */
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:baseline;gap:16px;padding:16px 34px;
  border-bottom:1px solid var(--edge);z-index:5;background:var(--void)}
.brand{font:600 13px/1 var(--mono);letter-spacing:.02em;color:var(--dim)}
.brand b{color:var(--torch);font-weight:600}
.langs{margin-left:auto;display:flex;gap:2px}
.langs button{font:600 11px/1 var(--mono);letter-spacing:.08em;color:var(--dim);
  background:none;border:1px solid transparent;border-radius:999px;padding:7px 13px;cursor:pointer}
.langs button:hover{color:var(--ink)}
.langs button[aria-pressed=true]{color:var(--void);background:var(--torch);border-color:var(--torch)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:1fr 1fr}
.essay{padding:0 clamp(24px,4.6vw,70px) 140px clamp(24px,6.4vw,116px);min-width:0}
.client{position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));border-left:1px solid var(--edge);
  background:linear-gradient(180deg,#1A1428,#120E1D);padding:18px 20px;
  display:flex;flex-direction:column;gap:12px;min-width:0;overflow:auto}

/* ---------- hero ---------- */
.hero{padding:clamp(56px,9vh,110px) 0 66px;max-width:780px}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.22em;color:var(--ok);
  display:inline-block;margin-bottom:26px}
h1{font:800 clamp(38px,5.4vw,74px)/1.06 var(--disp);letter-spacing:-.03em;margin:0}
h1 em{font-style:normal;color:var(--torch);
  text-shadow:0 0 34px rgba(240,165,74,.32)}
.deck{margin:28px 0 0;max-width:560px;font-size:17px;color:#CFC5E2}
.figures{display:flex;flex-wrap:wrap;gap:26px 40px;margin-top:44px;padding-top:24px;
  border-top:1px solid var(--edge);max-width:620px}
.fig b{display:block;font:600 22px/1 var(--mono);color:var(--ink);letter-spacing:-.02em}
.fig span{font:400 11px/1.4 var(--mono);letter-spacing:.12em;color:var(--dim);
  text-transform:uppercase;display:block;margin-top:8px}

/* ---------- chapters ---------- */
.ch{padding:74px 0;border-top:1px solid var(--edge);max-width:620px;scroll-margin-top:20px}
.mark{font:600 12px/1 var(--mono);letter-spacing:.02em;display:inline-block;
  padding:6px 10px;border-radius:5px;margin-bottom:20px;border:1px solid}
.mark.field{color:var(--torch);border-color:rgba(240,165,74,.4);background:rgba(240,165,74,.08)}
.mark.fn{color:var(--rune);border-color:rgba(156,123,232,.4);background:rgba(156,123,232,.08)}
.mark.event{color:var(--ok);border-color:rgba(121,192,139,.4);background:rgba(121,192,139,.08)}
.mark.kind{color:var(--bad);border-color:rgba(224,98,92,.4);background:rgba(224,98,92,.08)}
.ch h2{font:600 clamp(24px,2.6vw,33px)/1.25 var(--disp);letter-spacing:-.02em;margin:0 0 10px}
.lead{font-size:15px;color:var(--dim);margin:0 0 26px}
.ch p{margin:0 0 16px}
.ch b{font-weight:600;color:#fff}
.ch ul{margin:0 0 18px;padding:0;list-style:none}
.ch li{padding-left:20px;position:relative;margin:7px 0;font-size:15px}
.ch li::before{content:'';position:absolute;left:2px;top:.72em;width:6px;height:6px;
  background:var(--rune);transform:rotate(45deg)}
.lbl{font:600 10px/1 var(--mono);letter-spacing:.18em;color:var(--dim);
  text-transform:uppercase;display:block;margin:22px 0 8px}
pre{font:400 12.5px/1.7 var(--mono);background:#100C1B;border:1px solid var(--edge);
  border-radius:8px;padding:14px 16px;overflow-x:auto;margin:0 0 6px}
pre.now{border-left:2px solid var(--ok)}
code{font:400 .92em var(--mono);color:var(--torch);
  background:rgba(240,165,74,.09);padding:1px 5px;border-radius:4px}
.where{font:400 11px/1.6 var(--mono);color:var(--parch-dim);margin-top:24px;
  padding-top:12px;border-top:1px solid var(--edge)}

/* ---------- client: the two versions, in the patch's own marks ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:1px;flex:0 0 auto;
  background:var(--edge);border:1px solid var(--edge);border-radius:10px;overflow:hidden}
.modes[hidden]{display:none}
.mode{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:12px;
  padding:12px 15px;text-align:left;cursor:pointer;border:0;color:var(--dim);
  background:#170F26;transition:background .18s ease,color .18s ease}
.mode .sig{font:600 26px/1 var(--mono)}
.mode .nm{display:block;font:600 15px/1 var(--disp);letter-spacing:.09em}
.mode .sub{display:block;font:400 10px/1 var(--mono);letter-spacing:.2em;margin-top:7px;opacity:.8}
.mode[data-m=BEFORE] .sig{color:var(--bad);opacity:.6}
.mode[data-m=AFTER] .sig{color:var(--ok);opacity:.6}
.mode:hover{color:var(--ink);background:#201834}
.mode:hover .sig{opacity:1}
.mode[data-m=BEFORE][aria-selected=true]{background:var(--bad);color:#2A0E12}
.mode[data-m=AFTER][aria-selected=true]{background:var(--ok);color:#0C1C13}
.mode[aria-selected=true] .sig{color:inherit;opacity:.85}
.mode[aria-selected=true] .sub{opacity:.7}

/* ---------- client: viewport ---------- */
.scr{font:600 10px/1 var(--mono);letter-spacing:.18em;color:var(--dim);
  text-transform:uppercase;display:flex;align-items:center;gap:8px}
.scr::after{content:'';flex:1;height:1px;background:var(--edge)}
#view{width:100%;flex:1 1 auto;min-height:190px;display:block;border-radius:10px;
  background:radial-gradient(120% 90% at 50% 12%,#241C3A,#130F1F 72%);
  border:1px solid var(--edge)}
#view .ent{transform-box:fill-box;transform-origin:50% 50%}
#view .elab{font:600 9px var(--mono);fill:#EFE9F7;paint-order:stroke;
  stroke:#130F1F;stroke-width:3.4px;stroke-linejoin:round}

/* ---------- client: the printout ---------- */
.paper{background:var(--parch);color:var(--parch-ink);border-radius:4px;
  padding:14px 16px 15px;font:400 11px/1.85 var(--mono);
  box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 0 1px rgba(233,224,204,.14);
  position:relative;overflow:auto;flex:0 0 auto;max-height:44vh}
.paper h3{font:600 9px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--parch-dim);margin:0 0 10px}
.paper .row{white-space:nowrap}
.tok{font-weight:600;color:var(--parch-ink);cursor:pointer;border:0;background:none;
  padding:0 2px;font:inherit;font-weight:600;border-bottom:2px solid rgba(156,123,232,.5)}
.tok:hover{background:rgba(156,123,232,.2)}
.tok.lit{background:var(--torch);border-bottom-color:var(--torch)}
.paper .hint{color:var(--parch-dim);border-top:1px dashed rgba(43,35,56,.25);
  margin-top:11px;padding-top:9px;white-space:normal;line-height:1.6}

/* ---------- client: console ---------- */
.console{background:#100C1B;border:1px solid var(--edge);border-radius:8px;
  padding:11px 13px;flex:0 0 auto}
.act{font:400 12px/1.6 var(--mono);color:#CFE3FF;white-space:pre-wrap;word-break:break-all;
  min-height:20px;margin:0}
.act.gone{color:var(--bad);text-decoration:line-through;opacity:.7}
.act.good{color:#DCEFE2}
.feed{display:flex;flex-direction:column;gap:5px;margin-top:9px;
  min-height:88px;max-height:190px;overflow:auto}
.feed p{margin:0;font:400 11px/1.5 var(--mono);padding:6px 9px;border-radius:5px;
  background:rgba(121,192,139,.09);border-left:2px solid var(--ok);color:#C9E6D2;
  word-break:break-word}
.feed p.bad{background:rgba(224,98,92,.1);border-left-color:var(--bad);color:#F0CFCD}
.note{font:400 11.5px/1.6 var(--body);color:var(--dim);min-height:17px;margin:0}
.note::before{content:'— ';color:var(--torch)}
.meter{margin-left:auto;font:600 10px var(--mono);color:var(--dim);letter-spacing:.04em}
.meter em{font-style:normal;color:var(--torch)}

/* ---------- responsive ---------- */
@media(max-width:1080px){
  :root{--hdr:49px}
  .shell{grid-template-columns:1fr}
  .client{position:sticky;top:var(--hdr);height:auto;max-height:62vh;border-left:0;
    border-bottom:1px solid var(--edge);order:-1;padding:12px 16px;gap:9px}
  #view{min-height:150px}
  .mode{padding:9px 12px;column-gap:9px}
  .mode .sig{font-size:20px}
  .mode .nm{font-size:12px}
  .mode .sub{font-size:9px;margin-top:5px}
  .paper{max-height:136px}
  .paper .row{white-space:normal;text-indent:-1.1em;padding-left:1.1em}
  .feed{min-height:46px;max-height:82px}
  .essay{padding-bottom:80px}
  .top{padding:13px 18px;gap:10px;flex-wrap:wrap}
  .brand{font-size:11px}
  .langs button{padding:6px 10px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="top">
  <span class="brand">agent-target-addressing <b>→</b> master</span>
  <span class="langs" id="langs">
    <button data-l="ko" aria-pressed="true">한국어</button>
    <button data-l="zh" aria-pressed="false">繁體中文</button>
  </span>
</div>

<div class="shell">
  <main class="essay" id="essay"></main>
  <section class="client" aria-label="agent client">
    <div class="modes" id="d-tabs" role="tablist" aria-label="before / after" hidden>
      <button class="mode" data-m="BEFORE" role="tab" aria-selected="false">
        <span class="sig">&minus;</span>
        <span><span class="nm">BEFORE</span><span class="sub"></span></span>
      </button>
      <button class="mode" data-m="AFTER" role="tab" aria-selected="false">
        <span class="sig">+</span>
        <span><span class="nm">AFTER</span><span class="sub"></span></span>
      </button>
    </div>
    <span class="scr" id="scr-view"></span>
    <svg id="view" viewBox="22 28 326 200" aria-hidden="true"></svg>
    <div class="paper" id="paper"></div>
    <div class="console">
      <span class="scr" style="margin-bottom:8px">
        <span id="scr-act"></span>
        <span class="meter" id="d-meter"></span></span>
      <p class="act" id="d-act"></p>
      <div class="feed" id="d-feed"></div>
    </div>
    <p class="note" id="d-note"></p>
  </section>
</div>

function block(w,d,h,c){
  const at=(x,y,z)=>{const q=V(x,y,z),o=V(0,0);return [q[0]-o[0],q[1]-o[1]]};
  const t=[at(0,0,h),at(w,0,h),at(w,d,h),at(0,d,h)], pk=at(w/2,d/2,h+Math.min(.7,h*.55));
  const face=(a,b,f)=>`<polygon points="${pts([a,b,pk])}" fill="${shade(c,f)}"/>`;
  return `<polygon points="${pts([at(w,0),at(w,d),at(w,d,h),at(w,0,h)])}" fill="${shade(c,.52)}"/>
    <polygon points="${pts([at(0,d),at(w,d),at(w,d,h),at(0,d,h)])}" fill="${shade(c,.72)}"/>
    ${face(t[0],t[1],1)}${face(t[1],t[2],.86)}${face(t[2],t[3],.66)}${face(t[3],t[0],.94)}`;
}

const spot=(e,x,y,z=0)=>{const k=KIND[e.k];return V(x+(1-k.w)/2,y+(1-k.w)/2,z)};

const view=document.getElementById('view');
view.innerHTML=(()=>{
  let s='';
  for(let x=0;x<7;x++)for(let y=0;y<7;y++){
    const v=(Math.sin(x*12.9898+y*78.233)+1)/2;
    s+=`<polygon class="tile" points="${pts([V(x,y),V(x+1,y),V(x+1,y+1),V(x,y+1)])}"
        fill="${shade('#2E2745',.86+v*.26)}" stroke="#171125" stroke-width=".6"/>`;
  }
  for(const e of [...CAST].sort((a,b)=>(a.x+a.y)-(b.x+b.y))){
    const k=KIND[e.k], p=spot(e,e.x,e.y), lab=[0,-k.h*14-13];
    // seeded as an inline CSS transform, not an attribute: anime caches the
    // transform it finds in `style`, and an attribute would read back as 0 —
    // any later scale tween would then snap the whole cast to the origin.
    s+=`<g class="ent" id="e-${e.id}" style="transform:translateX(${p[0]}px) translateY(${p[1]}px)">
      ${block(k.w,k.w,k.h,k.c)}
      ${e.l?`<text class="elab" x="${lab[0]}" y="${lab[1]}" text-anchor="middle">${e.l}</text>`:''}
    </g>`;
  }
  return s;
})();

/* ---------- render ---------- */
let lang=/[?&]lang=zh/.test(location.search)?'zh':'ko';
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function blockHTML(b){
  if(b.t==='p')return `<p>${b[lang]}</p>`;
  if(b.t==='lbl')return `<span class="lbl">${b[lang]}</span>`;
  if(b.t==='code')return `<pre class="${b.cls||''}">${esc(b.v)}</pre>`;
  if(b.t==='ul')return `<ul>${b.items.map(i=>`<li>${i[lang]}</li>`).join('')}</ul>`;
  return '';
}
function renderEssay(){
  const h=HERO[lang];
  $('#essay').innerHTML=`
    <header class="hero">
      <span class="eyebrow">[Arrived]</span>
      <h1>${h.h1}</h1>
      <p class="deck">${h.deck}</p>
      <div class="figures">${FIGS.map(f=>
        `<span class="fig"><b>${f.v}</b><span>${f[lang]}</span></span>`).join('')}</div>
    </header>
    ${CH.map(c=>`<article class="ch" id="ch-${c.id}">
      <span class="mark ${c.kind}">${esc(c.mark)}</span>
      <h2>${c[lang].title}</h2>
      <p class="lead">${c[lang].lead}</p>
      ${c.blocks.map(blockHTML).join('')}
      <p class="where">${c.where}</p>
    </article>`).join('')}`;
}
function renderPaper(cast){
  const rows=PAPER.filter(r=>cast.includes(r.ent)).map(r=>{
    const html=esc(r.row).replace(/\{([^}]+)\}/g,
      (_,t)=>`<button class="tok" data-ent="${r.ent}" data-tok="${t}">${t}</button>`);
    return `<div class="row">${html}</div>`;
  }).join('');
  $('#paper').innerHTML=`<h3>${UI[lang].paper}</h3>${rows}
    <div class="hint">${UI[lang].hint}</div>`;
}
function renderChrome(){
  document.documentElement.lang=lang==='zh'?'zh-TW':'ko';
  $('#scr-view').textContent=UI[lang].view;
  $('#scr-act').textContent=UI[lang].act;
  $('.mode[data-m=BEFORE] .sub').textContent=UI[lang].before;
  $('.mode[data-m=AFTER] .sub').textContent=UI[lang].after;
  [...$('#langs').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
}

/* ---------- the client ---------- */
let gen=0, current=null, MODE='BEFORE';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const anim=o=>RM?anime.set(o.targets,{}):anime(o);

function dress(cast){
  for(const e of CAST){
    const on=cast.includes(e.id)||DECOR.includes(e.id);
    const dim=DECOR.includes(e.id)&&!cast.includes(e.id);
    anime({targets:'#e-'+e.id,opacity:on?(dim?.34:1):0,duration:RM?0:420,easing:'easeOutQuad'});
  }
}
// one instance per element: two concurrent tweens on the same transform fight
function place(id,x,y,z=0,dur=850){
  const p=spot(ENT[id],x,y,z);
  anim({targets:'#e-'+id,translateX:p[0],translateY:p[1],
    scale:[{value:1.09,duration:dur*.3},{value:1,duration:dur*.7}],
    duration:dur,easing:'easeInOutQuad'});
}
function lightToken(ids){
  document.querySelectorAll('.tok').forEach(t=>t.classList.toggle('lit',ids.includes(t.dataset.ent)));
}
const SVGN='http://www.w3.org/2000/svg';
function bubble(text,dur=1600){
  const me=document.getElementById('e-me'); if(!me)return;
  const g=document.createElementNS(SVGN,'g');
  g.setAttribute('class','bub');
  g.innerHTML=`<rect x="-46" y="-60" width="92" height="28" rx="14" fill="#E9E0CC"
      stroke="#9C7BE8" stroke-width="1.2"/>
    <path d="M -5 -32 L 1 -19 L 7 -33 Z" fill="#E9E0CC" stroke="#9C7BE8" stroke-width="1.2" stroke-linejoin="round"/>
    <text x="0" y="-40" text-anchor="middle" font-size="11"
      font-family="var(--mono)" font-weight="600" fill="#2B2338">${esc(text)}</text>`;
  me.appendChild(g);
  anim({targets:g,opacity:[0,1],scale:[.5,1],translateY:[6,0],duration:260,easing:'easeOutBack'});
  setTimeout(()=>anim({targets:g,opacity:[1,0],translateY:[0,-12],duration:300,easing:'easeInQuad',
    complete:()=>g.remove()}),dur-340);
}
function setTabs(mode){
  [...$('#d-tabs').children].forEach(b=>b.setAttribute('aria-selected',b.dataset.m===mode));
}
function frame(f){
  if(f.clear){$('#d-feed').innerHTML='';$('#d-act').textContent='';$('#d-act').className='act'}
  if(f.mode)setTabs(f.mode);
  if(f.act!==undefined){$('#d-act').textContent=f.act;$('#d-act').className='act '+(f.cls||'');
    anim({targets:'#d-act',opacity:[0,1],translateX:[8,0],duration:280,easing:'easeOutQuad'})}
  if(f.meter){
    const em=$('#d-meter').querySelectorAll('em');
    const cur=[...em].map(e=>+e.textContent);
    $('#d-meter').innerHTML=`events <em>${cur[0]??f.meter[0]}</em> · commands <em>${cur[1]??f.meter[1]}</em>`;
    const now=$('#d-meter').querySelectorAll('em');
    f.meter.forEach((v,i)=>{const from=+now[i].textContent; if(from===v)return;
      anim({targets:{n:from},n:v,round:1,duration:520,easing:'easeOutQuad',
        update:a=>{now[i].textContent=a.animatables[0].target.n},
        begin:()=>anim({targets:now[i],scale:[1,1.7],direction:'alternate',duration:260})});
      if(RM)now[i].textContent=v;
    });
  }
  if(f.move)for(const[id,[x,y,z=0]]of Object.entries(f.move))place(id,x,y,z,f.ms?Math.min(f.ms,900):850);
  if(f.bump)anim({targets:'#e-'+f.bump,
    translateX:[{value:'-=7',duration:70},{value:'+=12',duration:80},
                {value:'-=9',duration:80},{value:'+=4',duration:90}],easing:'easeInOutSine'});
  if(f.flash){lightToken(f.flash);
    anim({targets:f.flash.map(i=>'#e-'+i),scale:[{value:1.28,duration:200},{value:1,duration:300}],
      delay:anime.stagger(110),easing:'easeOutQuad'})}
  if(f.say)bubble(f.say,f.ms||1600);
  if(f.ev){const p=document.createElement('p');
    p.className=f.bad?'bad':'';p.textContent=f.ev;$('#d-feed').appendChild(p);
    $('#d-feed').scrollTop=9999;
    anim({targets:p,opacity:[0,1],translateY:[-7,0],duration:280,easing:'easeOutQuad'});
    if(f.bad)anim({targets:p,translateX:[0,-4,4,-3,3,0],duration:400,delay:160,easing:'easeInOutSine'})}
  if(f.note)$('#d-note').textContent=f.note[lang];
}
function clearConsole(){
  $('#d-feed').innerHTML='';$('#d-act').textContent='';$('#d-act').className='act';
  $('#d-note').textContent='';$('#d-meter').innerHTML='';
  lightToken([]);
}

async function run(ch){
  const my=++gen; current=ch;
  const segs=segmentsOf(ch), hasMode=segs.some(s=>s.mode);
  $('#d-tabs').hidden=!hasMode;
  if(hasMode)setTabs(MODE);
  const seg=(hasMode?segs.find(s=>s.mode===MODE)||segs[0]:segs[0]);
  const frames=seg.frames, cast=seg.cast||ch.cast;
  // a segment may print less than it shows: the old world state left the far
  // dungeon standing there, just unnamed — and what is not named cannot be a target
  renderPaper(seg.paper||cast); dress(cast); clearConsole();
  for(const e of CAST)if(e.id!=='me')place(e.id,e.x,e.y,0,RM?0:1);
  place('me',ENT.me.x,ENT.me.y,0,RM?0:1);
  if(RM){frames.forEach(frame);return}
  await sleep(500); if(gen!==my)return;
  for(;;){
    for(const f of frames){frame(f); await sleep(f.ms||1600); if(gen!==my)return}
    await sleep(1800); if(gen!==my)return;
    clearConsole(); place('me',ENT.me.x,ENT.me.y);
    await sleep(700); if(gen!==my)return;
  }
}
function segmentsOf(ch){
  const segs=[]; let cur=null;
  for(const f of ch.demo){
    if(f.mode){cur={mode:f.mode,frames:[],cast:f.cast,paper:f.paper};segs.push(cur)}
    if(!cur)cur={mode:null,frames:[]},segs.push(cur);
    cur.frames.push(f);
  }
  return segs;
}
function pickMode(m){
  if(m===MODE)return;
  MODE=m; setTabs(MODE);
  if(current)run(current);
}
$('#d-tabs').addEventListener('click',e=>{
  const b=e.target.closest('.mode'); if(b)pickMode(b.dataset.m);
});
$('#d-tabs').addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  e.preventDefault();
  const next=$(`.mode[data-m=${MODE==='BEFORE'?'AFTER':'BEFORE'}]`);
  next.focus(); pickMode(next.dataset.m);
});

/* point at anything the printout names */
$('#paper').addEventListener('click',async e=>{
  const t=e.target.closest('.tok'); if(!t)return;
  const my=++gen, ent=ENT[t.dataset.ent], tok=t.dataset.tok;
  clearConsole(); lightToken([ent.id]);
  frame({act:`{"type":"move","target":${/^\d+$/.test(tok)?tok:`"${tok}"`}}`});
  const near=ent.k==='dun'?[ent.x-1,ent.y]:[ent.x-1,ent.y];
  place('me',Math.max(0,near[0]),near[1]);
  await sleep(RM?0:900); if(gen!==my)return;
  frame({ev:UI[lang].arrived(tok)});
  await sleep(RM?0:2600); if(gen!==my)return;
  if(current)run(current);
});

/* the chapter in view drives the client */
const io=new IntersectionObserver(es=>{
  const hit=es.filter(e=>e.isIntersecting)
    .sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];
  if(!hit)return;
  const ch=CH.find(c=>'ch-'+c.id===hit.target.id);
  if(ch&&ch!==current)run(ch);
},{rootMargin:'-25% 0px -45% 0px'});

function boot(){
  renderChrome(); renderEssay();
  CH.forEach(c=>io.observe(document.getElementById('ch-'+c.id)));
  run(CH[0]);
  if(!RM){
    anime({targets:'#view .tile',opacity:[0,1],delay:anime.stagger(9),duration:420,easing:'linear'});
    anime({targets:'.hero .eyebrow, .hero h1, .hero .deck, .hero .figures',opacity:[0,1],
      translateY:[14,0],delay:anime.stagger(90,{start:120}),duration:640,easing:'easeOutQuad'});
  }
}
$('#langs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.dataset.l===lang)return;
  lang=b.dataset.l; renderChrome(); renderEssay();
  CH.forEach(c=>io.observe(document.getElementById('ch-'+c.id)));
  const keep=current||CH[0]; current=null; run(keep);
});
boot();
</script>
</body>
